<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Bar Graph</title>
    <style>
        canvas {
            border: 1px solid black;
            display: block;
            margin: 20px auto;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Random Bar Graph</h1>
    <canvas id="barGraphCanvas" width="600" height="400"></canvas>
    <button id="updateButton">Update Bar Graph</button>
    <button id="customUpdateButton">Add 5 to Each Bar</button>

    <script src="script.js"></script>
</body>
</html>
